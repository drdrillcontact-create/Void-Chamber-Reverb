name: Build plugins

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 VST3
            os: windows-2022
            format: VST3
            bundle: Void Chamber Reverb.vst3
            artifact: VoidChamberReverb-Windows-x64-VST3
          - name: macOS universal AU
            os: macos-15
            format: AU
            bundle: Void Chamber Reverb.component
            artifact: VoidChamberReverb-macOS-universal-AU
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out JUCE 8.0.17-security
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: juce-framework/JUCE
          ref: dabd5ad13cd869cba41046947fffc8e5ce5cd662
          path: deps/JUCE
          persist-credentials: false

      - name: Configure Windows x64
        if: runner.os == 'Windows'
        env:
          JUCE_ROOT: ${{ github.workspace }}/deps/JUCE
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure macOS (Apple Silicon and Intel)
        if: runner.os == 'macOS'
        env:
          JUCE_ROOT: ${{ github.workspace }}/deps/JUCE
        run: cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'

      - name: Build binary-data target and dump generated header symbols
        shell: bash
        run: |
          cmake --build build --target VoidChamberAssets --config Release 2>&1 | tee binarydata.log
          hdr=$(find build -name BinaryData.h -path '*binarydata*' | head -1)
          echo "header: $hdr"
          if [ -n "$hdr" ]; then
            grep -o -E '(Raleway[A-Za-z0-9_]*|voidbackground_jpg|space[A-Za-z0-9_]*jpg)' "$hdr" | sort | uniq -c | while IFS= read -r line; do
              echo "sym $line"
            done
            echo "total lines $(wc -l < "$hdr")"
          else
            echo "::error::BinaryData.h not generated"
          fi

      - name: Build ${{ matrix.format }}
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target VoidChamberReverb_${{ matrix.format }} ReverbDSPTests EditorSnapshotTest --parallel 3 2>&1 | tee build-output.log

      # Raw logs are not reachable from every environment; surface the interesting lines as annotations.
      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f build-output.log ]; then
            grep -a -E -i "error|fatal|undefined|FAILED" build-output.log | head -80 | while IFS= read -r line; do
              line=${line//%/25}
              line=${line//$'\r'/}
              echo "::error::${line}"
            done
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ runner.os }}
          path: build-output.log
          if-no-files-found: warn

      - name: Run DSP and editor-snapshot tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare temporary visual review image
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            sips -s format jpeg -s formatOptions 40 --resampleWidth 900 build/editor-snapshot.png --out build/editor-review.jpg >/dev/null
          else
            powershell -NoProfile -Command 'Add-Type -AssemblyName System.Drawing; $img = [System.Drawing.Image]::FromFile("build/editor-snapshot.png"); $img.Save("build/editor-review.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg); $img.Dispose()'
          fi
      - name: Visual review part 1
        run: python tools/ci-visual-review.py 0
      - name: Visual review part 2
        run: python tools/ci-visual-review.py 1
      - name: Visual review part 3
        run: python tools/ci-visual-review.py 2
      - name: Visual review part 4
        run: python tools/ci-visual-review.py 3
      - name: Visual review part 5
        run: python tools/ci-visual-review.py 4
      - name: Visual review part 6
        run: python tools/ci-visual-review.py 5

      - name: Upload editor snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-snapshot-${{ runner.os }}
          path: build/editor-snapshot*.png
          if-no-files-found: warn

      # Archive the entire bundle, including its top-level directory and Unix mode bits.
      - name: Package plugin
        working-directory: build/VoidChamberReverb_artefacts/Release/${{ matrix.format }}
        run: cmake -E tar cf "${{ matrix.artifact }}.zip" --format=zip -- "${{ matrix.bundle }}"

      - name: Upload plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          path: build/VoidChamberReverb_artefacts/Release/${{ matrix.format }}/${{ matrix.artifact }}.zip
          if-no-files-found: error
